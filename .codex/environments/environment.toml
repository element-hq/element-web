# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "element-web"

[setup]
script = '''
set -eu
cd "${CODEX_WORKTREE_PATH:-.}"

echo "setup runner reached the project"
node --version
git --version
command -v pnpm || true'''

[[actions]]
name = "Start"
icon = "tool"
command = '''
worktree="${CODEX_WORKTREE_PATH:-$(pwd)}"
export NX_DAEMON=false
export NX_WORKSPACE_DATA_DIRECTORY="$worktree/.nx/workspace-data"
export NX_CACHE_DIRECTORY="$worktree/.nx/cache"
cd "$worktree/apps/web"
pnpm start'''

[[actions]]
name = "Test"
icon = "tool"
command = "cd apps/web && pnpm test"
