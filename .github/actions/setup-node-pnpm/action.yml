name: Set up pnpm and Node with the pnpm store outside node_modules
description: |
    Installs pnpm, points its store at a directory outside any node_modules, then installs Node with
    pnpm caching: the setup every job that installs @element-hq/element-call-component needs.

    Temporary, until @element-hq/element-call-component is published to npm. As a git dependency it is
    built on install by its `prepare` script, and pnpm runs that build in a checkout inside its store.
    pnpm/action-setup puts the store under ~/setup-pnpm/node_modules/.bin, and front-end tooling treats
    anything under a node_modules path as third-party code: Element Call's Babel and React Compiler
    passes skip its sources and its tsconfig is ignored, producing a bundle no local build produces, and
    almost no type declarations. Pointing the store elsewhere is the only fix available on this side; the
    proper fix is publishing the package, or making its `prepare` build path-independent.

    The three steps are one action so that their order is fixed here: the store must be relocated after
    pnpm is installed and before actions/setup-node, whose pnpm cache is keyed on `pnpm store path`.
inputs:
    node-version:
        description: The Node version to install, as actions/setup-node's node-version input
        required: false
        default: "lts/*"
    cache:
        description: actions/setup-node's cache input; "pnpm" to cache the pnpm store, empty for no cache
        required: false
        default: "pnpm"
runs:
    using: composite
    steps:
        - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

        - name: Keep the pnpm store out of node_modules
          # The value written is a constant built from RUNNER_TEMP, with nothing attacker-controlled in it;
          # zizmor flags every GITHUB_ENV write in an action because it cannot see the calling trigger.
          run: echo "pnpm_config_store_dir=${RUNNER_TEMP}/pnpm-store" >> "$GITHUB_ENV" # zizmor: ignore[github-env]
          shell: bash

        - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
          with:
              cache: ${{ inputs.cache }}
              node-version: ${{ inputs.node-version }}
