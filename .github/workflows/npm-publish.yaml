name: Publish npm package
run-name: Publish ${{ inputs.package }}
on:
    workflow_dispatch:
        inputs:
            package:
                description: Which package to release
                required: true
                type: choice
                options:
                    - playwright-common
                    - shared-components
                    - shared-utils
                    - module-api

concurrency: release
jobs:
    publish:
        name: "Publish"
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write

        steps:
            - name: 🧮 Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: 🔧 Set up pnpm & node environment
              uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
              with:
                  cache: true
                  install: true
                  require-lockfile: true

            - name: 🚀 Publish to npm
              working-directory: packages/${{ inputs.package }}
              run: pnpm publish --access public --provenance --publish-branch develop
