name: Release module
run-name: Release modules

on:
    push:
        tags:
            - "module/*/v*.*.*"

permissions: {}

jobs:
    release:
        name: Build and release module
        runs-on: ubuntu-26.04
        permissions:
            contents: write
        steps:
            - name: Parse tag
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  MODULE=$(echo "$TAG" | cut -d'/' -f2)
                  VERSION=$(echo "$TAG" | cut -d'/' -f3)
                  echo "MODULE=$MODULE" >> "$GITHUB_ENV"
                  echo "VERSION=$VERSION" >> "$GITHUB_ENV"
                  echo "TAG=$TAG" >> "$GITHUB_ENV"
                  echo "ARCHIVE=${MODULE}-${VERSION}.zip" >> "$GITHUB_ENV"

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
              with:
                  cache: true
                  install: true
                  require-lockfile: true

            - name: Build
              run: pnpm --filter "./modules/$MODULE" run build

            - name: Create archive
              run: zip -r "$ARCHIVE" -j "modules/$MODULE/lib"

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "$TAG" \
                    --title "$VERSION $MODULE" \
                    --draft \
                    --latest=false \
                    "$ARCHIVE"
